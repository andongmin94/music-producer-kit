name: Temporary source review transfer
on:
  push:
    branches: [work/remove-specialists]
    paths: [.github/workflows/review-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git archive --format=zip --output=review-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source
          path: review-source.zip
          retention-days: 1
