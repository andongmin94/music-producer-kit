name: Apply verified local selection
on:
  push:
    branches: [work/remove-specialists]
    paths: [.github/workflows/finalize-selection.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/remove-specialists
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed edits and remove temporary transfer paths
        run: python _review/apply.py
      - run: python -m pip install -r plugins/music-producer-kit/requirements.txt
      - run: python tools/check.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check.py --package dist/music-producer-kit.zip
      - name: Commit validated selection on review branch only
        env:
          START_SHA: ${{ github.sha }}
        run: |
          git fetch origin work/remove-specialists
          test "$(git rev-parse origin/work/remove-specialists)" = "$START_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: remove excluded source data and add local sample discovery'
          git push origin HEAD:work/remove-specialists
