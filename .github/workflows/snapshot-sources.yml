name: Capture pinned source library
on:
  push:
    branches: [main]
    paths: ['.github/workflows/snapshot-sources.yml']
permissions:
  contents: write
jobs:
  snapshot:
    if: github.repository == 'andongmin94/music-producer-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Copy complete tracked files without running upstream code
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          library = root / 'plugins/music-producer-kit/library'
          (library / 'archives').mkdir(parents=True, exist_ok=True)
          (library / 'notices').mkdir(exist_ok=True)
          pins = {
              'jtydhr88/music-composition-skills': '064683f05643ba1801063c0f4cac848cdd1e36a8',
              'jtydhr88/lyric-writing-skills': '91bb089a835fbccd268ea5b6da81f284d84526d5',
          }
          inventory = json.loads((root / 'docs/upstream-inventory.json').read_text())
          if {s['repo']: s['commit'] for s in inventory['sources']} != pins:
              raise ValueError('Inventory does not match the reviewed source pins')
          catalog = {'version': 1, 'sources': []}
          report = {'date': '2026-09-18', 'upstream_code_executed': False, 'sources': []}
          for source in inventory['sources']:
              repo, commit = source['repo'], source['commit']
              slug = repo.split('/')[1]
              target = library / 'archives' / (slug + '.zip')
              with tempfile.TemporaryDirectory() as temp:
                  def git(*args):
                      return subprocess.check_output(['git', '-C', temp, *args])
                  git('init', '--bare', '--quiet')
                  git('fetch', '--quiet', '--depth=1', 'https://github.com/' + repo + '.git', commit)
                  if git('rev-parse', 'FETCH_HEAD').decode().strip() != commit:
                      raise ValueError('Fetched commit mismatch')
                  entries = git('ls-tree', '-r', '-z', '--full-tree', commit).split(b'\0')
                  files, total = [], 0
                  with zipfile.ZipFile(target, 'x', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                      for entry in entries:
                          if not entry:
                              continue
                          metadata, raw_path = entry.split(b'\t', 1)
                          mode, kind, sha = metadata.decode().split()
                          path = raw_path.decode('utf-8')
                          if kind != 'blob' or mode not in ('100644', '100755'):
                              raise ValueError('External gitlinks/symlinks are not self-contained: ' + path)
                          if PurePosixPath(path).is_absolute() or '..' in PurePosixPath(path).parts or '\\' in path:
                              raise ValueError('Unsafe source path: ' + path)
                          data = git('cat-file', 'blob', sha)
                          total += len(data)
                          if total > 20_000_000:
                              raise ValueError('Unexpected source size')
                          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                          if actual != sha:
                              raise ValueError('Source blob hash mismatch')
                          info = zipfile.ZipInfo(path, date_time=(2026, 9, 18, 0, 0, 0))
                          info.create_system = 3
                          info.compress_type = zipfile.ZIP_DEFLATED
                          info.external_attr = int(mode, 8) << 16
                          archive.writestr(info, data)
                          files.append({'path': path, 'mode': mode, 'size': len(data), 'git_blob_sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
                          if path in ('LICENSE', 'NOTICE'):
                              (library / 'notices' / (slug + '-' + path + '.txt')).write_bytes(data)
                  paths = {f['path'] for f in files}
                  if not {'LICENSE', 'NOTICE'} <= paths:
                      raise ValueError('Upstream rights notices missing')
                  expected = {source['skills_directory'] + '/' + s['name'] + '/SKILL.md' for s in source['skills']}
                  actual = {p for p in paths if p.startswith(source['skills_directory'] + '/') and p.endswith('/SKILL.md')}
                  if expected != actual:
                      raise ValueError('Module inventory mismatch')
                  with zipfile.ZipFile(target) as archive:
                      if archive.testzip() is not None or set(archive.namelist()) != paths:
                          raise ValueError('Archive readback failed')
                  record = {'repo': repo, 'commit': commit, 'tree': git('rev-parse', commit + '^{tree}').decode().strip(), 'archive': 'archives/' + slug + '.zip', 'archive_sha256': hashlib.sha256(target.read_bytes()).hexdigest(), 'skills_directory': source['skills_directory'], 'modules': sorted(s['name'] for s in source['skills']), 'files': files}
                  catalog['sources'].append(record)
                  report['sources'].append({'repo': repo, 'commit': commit, 'tree': record['tree'], 'modules': len(expected), 'files': len(files), 'bytes': total, 'archive_sha256': record['archive_sha256'], 'blob_hashes_verified': True, 'zip_readback': 'pass'})
          (library / 'catalog.json').write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'docs/SOURCE_SNAPSHOT_REPORT.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Check existing working product
        run: |
          python -m pip install -r plugins/music-producer-kit/requirements.txt
          python tools/check.py
          python -m unittest discover -s tests -v
      - name: Commit source data only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/music-producer-kit/library docs/SOURCE_SNAPSHOT_REPORT.json
          git commit -m 'data: preserve complete pinned music and lyric source snapshots'
          git push origin HEAD:main
