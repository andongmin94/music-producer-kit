name: Verify selected source transition
on:
  push:
    branches: [work/remove-excluded-sources]
    paths: [.maintenance/finalize.py, .github/workflows/source-cleanup.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .maintenance/finalize.py
      - run: python -m pip install -r plugins/music-producer-kit/requirements.txt
      - run: python tools/check.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check.py --package dist/music-producer-kit.zip
      - name: Commit verified expectation adjustments on the work branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests tools/check.py plugins/music-producer-kit/skills/music-producer/references
          git commit -m 'test: align regression checks with selected source data'
          git push origin HEAD:work/remove-excluded-sources
